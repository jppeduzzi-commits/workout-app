<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#f5f5f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Stack" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <title>Stack</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { background: #f5f5f5; }
      /* Typing focus: enlarge the active field (see src/useTypingFocus.js).
         !important is needed to beat the components' inline styles. */
      .typing [data-typing-scroll] input:not([type="checkbox"]):not([type="radio"]):focus,
      .typing [data-typing-scroll] textarea:focus {
        font-size: 22px !important; min-width: 76px;
        border-color: #2563eb !important; background: #fff !important;
        box-shadow: inset 0 0 0 1px #2563eb;
      }
      /* Room to center fields near the end of the list */
      .typing [data-typing-scroll]::after { content: ""; display: block; height: 50vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
